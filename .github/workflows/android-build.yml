
name: Build Bhaskar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Bhaskar_App_Builder_V3.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q Bhaskar_App_Builder_V3.zip -d source

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bhaskar-App-Builder-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
